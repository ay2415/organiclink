version: '3.8'

services:

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: organiclink_postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-organiclink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-organiclink_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-organiclink_db}

    # IMPORTANT:
    # PostgreSQL is NOT exposed to the public Internet.
    # The backend communicates with PostgreSQL internally
    # using the Docker network hostname "postgres".
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-organiclink} -d ${POSTGRES_DB:-organiclink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Backend (FastAPI / Uvicorn)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: organiclink_backend
    restart: always

    # Port 8000 is internal-only to Docker network.
    # All client browser traffic enters through Nginx on Port 80.
    expose:
      - "8000"

    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-organiclink}:${POSTGRES_PASSWORD:-organiclink_secure_password_2026}@postgres:5432/${POSTGRES_DB:-organiclink_db}
      SECRET_KEY: ${SECRET_KEY:-organiclink_production_jwt_secret_key_change_me}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      VARIANCE_TOLERANCE_PERCENT: ${VARIANCE_TOLERANCE_PERCENT:-10.0}

    volumes:
      # Persistent uploaded produce photos and generated PDF documents
      - uploads_data:/app/uploads
      # Pretrained Computer Vision model weights (ResNet-18 & YOLOv8)
      - ./backend/cv/models:/app/cv/models

    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # Frontend (Nginx Reverse Proxy & React SPA)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: organiclink_frontend
    restart: always

    # Public web entrypoint
    # Azure VM port 80 -> Frontend Nginx container port 80
    ports:
      - "80:80"

    depends_on:
      - backend

# ==============================================================
# Persistent Named Volumes
# ==============================================================
volumes:
  postgres_data:
  uploads_data:
