version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: organiclink_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-organiclink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-organiclink_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-organiclink_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-organiclink} -d ${POSTGRES_DB:-organiclink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: organiclink_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-organiclink}:${POSTGRES_PASSWORD:-organiclink_secure_password_2026}@postgres:5432/${POSTGRES_DB:-organiclink_db}
      SECRET_KEY: ${SECRET_KEY:-organiclink_production_jwt_secret_key_change_me}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
      VARIANCE_TOLERANCE_PERCENT: ${VARIANCE_TOLERANCE_PERCENT:-10.0}
    volumes:
      - uploads_data:/app/uploads
      - ./backend/cv/models:/app/cv/models
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: organiclink_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
