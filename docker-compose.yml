version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: organiclink_postgres
    environment:
      POSTGRES_USER: organiclink
      POSTGRES_PASSWORD: organiclink_pass
      POSTGRES_DB: organiclink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organiclink -d organiclink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: organiclink_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://organiclink:organiclink_pass@postgres:5432/organiclink_db
      SECRET_KEY: organiclink-secret-key-change-in-production-2026-irish-organic
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/cv/models:/app/cv/models
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: organiclink_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
